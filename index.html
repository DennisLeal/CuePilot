<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>CuePilot - Control Center</title>
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; background: #121212; color: #e0e0e0; margin: 0; padding: 20px; }
        h1 { color: #bb86fc; font-size: 24px; }
        .card { background: #1e1e1e; padding: 15px; border-radius: 8px; margin-bottom: 15px; border: 1px solid #333; }
        button { background: #bb86fc; color: #121212; border: none; padding: 10px 18px; font-weight: bold; border-radius: 4px; cursor: pointer; margin-right: 10px; }
        button:hover { background: #9965f4; }
        textarea { width: 100%; height: 80px; background: #2c2c2c; color: #fff; border: 1px solid #444; border-radius: 4px; padding: 8px; margin-top: 5px; box-sizing: border-box; }
        #transcript { background: #000; padding: 10px; height: 120px; overflow-y: auto; font-family: monospace; border-radius: 4px; border: 1px solid #333; }
    </style>
</head>
<body>
    <h1>CuePilot — AI Interview Copilot</h1>
    <div class="card">
        <h3>Interview Session Controls</h3>
        <button id="startBtn">Start Listening</button>
        <button id="stopBtn">Stop</button>
        <span id="status" style="margin-left: 15px; color: #03dac6;">Status: Local Ollama Engine Ready</span>
    </div>
    <div class="card">
        <h3>Live Transcript Window</h3>
        <div id="transcript">[Awaiting input stream from meeting audio...]</div>
    </div>
    <div class="card">
        <h3>Test Prompt Generator (Webcam Teleprompter)</h3>
        <label>Interviewer Question:</label>
        <textarea id="questionInput">Tell me about a time you handled a high-pressure technical escalation.</textarea>
        <br><br>
        <button id="generateBtn">Push Answer Talking Points to Overlay</button>
    </div>
    <script>
        const { ipcRenderer } = require('electron');
        document.getElementById('generateBtn').addEventListener('click', () => {
            const q = document.getElementById('questionInput').value;
            ipcRenderer.send('update-prompt', {
                title: "Suggested STAR Talking Points:",
                text: "• Situation: Severe service bottleneck in queue operations.\n• Task: Restore compliance within SLA target.\n• Action: Triaged ticket workflows & automated routing rules.\n• Result: Reduced ticket resolution window by 35%."
            });
            document.getElementById('transcript').innerHTML += <br><span style="color:#bb86fc">[Interviewer]:</span> ;
        });
    </script>
</body>
</html>
